data:
  nih_path: "data/raw/NIH"
  shenzhen_path: "data/raw/Shenzhen"
  montgomery_path: "data/raw/Montgomery"
  processed_dir: "data/processed"
  image_size: 224
  num_hospitals: 10
  split_strategy: non_iid   # options: iid, non_iid
  split_alpha: 1.0          # Balance parameter for non-iid split


model:
  backbone: "vit_tiny"        # options: resnet50, vit_small
  embed_dim: 192
  mask_ratio: 0.80
  decoder_depth: 4

ssl:
  epochs_per_round: 2
  batch_size: 8
  lr: 1.0e-3
  limit_samples: 15000
  optimizer: adamw

federated:
  rounds: 5
  aggregation: fedprox       # options: fedavg, fedprox
  fedprox_mu: 0.01

finetuning:
  few_shot_k: 5             # 5-shot = 5 samples per class, 10 total for binary TB
  projection_dim: 128
  epochs: 15
  lr: 1.0e-3
  freeze_encoder: false
  seed: 42
  support_sampling: random_stratified

evaluation:
  test_set: montgomery
  metrics:
    - auc
    - accuracy
    - sensitivity
    - specificity
    - f1
    - balanced_accuracy

logging:
  log_dir: experiments/logs/
  checkpoint_dir: experiments/checkpoints/