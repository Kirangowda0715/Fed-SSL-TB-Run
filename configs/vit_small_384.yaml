data:
  nih_path: "data/raw/NIH"
  shenzhen_path: "data/raw/Shenzhen"
  montgomery_path: "data/raw/Montgomery"
  processed_dir: "data/processed"
  image_size: 224
  num_hospitals: 10
  split_strategy: non_iid
  split_alpha: 1.0

model:
  backbone: "vit_small"
  embed_dim: 384
  mask_ratio: 0.80
  decoder_depth: 4

ssl:
  epochs_per_round: 2
  batch_size: 24
  lr: 1.0e-3
  limit_samples: 50000
  optimizer: adamw

federated:
  rounds: 100
  aggregation: fedprox
  fedprox_mu: 0.01

finetuning:
  few_shot_k: 20
  projection_dim: 256
  epochs: 200
  lr: 1.0e-3
  freeze_encoder: true
  seed: 42
  support_sampling: random_stratified

evaluation:
  test_set: montgomery
  metrics:
    - auc
    - accuracy
    - sensitivity
    - specificity
    - f1
    - balanced_accuracy

logging:
  log_dir: "experiments/vit_small/logs"
  checkpoint_dir: "experiments/vit_small/checkpoints"
