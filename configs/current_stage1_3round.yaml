data:
  nih_path: "data/raw/NIH"
  shenzhen_path: "data/raw/Shenzhen"
  montgomery_path: "data/raw/Montgomery"
  processed_dir: "data/processed"
  image_size: 224
  num_hospitals: 10
  split_strategy: non_iid
  split_alpha: 1.0

model:
  backbone: "vit_tiny"
  embed_dim: 192
  mask_ratio: 0.80
  decoder_depth: 4

ssl:
  epochs_per_round: 1
  batch_size: 6
  lr: 1.0e-3
  limit_samples: 500
  optimizer: adamw

federated:
  rounds: 3
  aggregation: fedprox
  fedprox_mu: 0.01

finetuning:
  few_shot_k: 5
  projection_dim: 128
  epochs: 30
  lr: 1.0e-3
  freeze_encoder: true
  seed: 42
  support_sampling: random_stratified

evaluation:
  test_set: montgomery
  metrics:
    - auc
    - accuracy
    - sensitivity
    - specificity
    - f1
    - balanced_accuracy

logging:
  log_dir: experiments/logs/current_stage1_3round/
  checkpoint_dir: experiments/checkpoints/current_stage1_3round/
